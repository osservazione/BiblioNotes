<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BiblioNotes</title>
<!-- Configurazioni PWA e Web App -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/337/337946.png">
<meta name="theme-color" content="#5a3920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BiblioNotes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f4f1ea;--panel:#fff;--ink:#222;--mut:#777;--line:#d9d4c7;--acc:#2f6f5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--panel:#2a2a27;--ink:#eee;--mut:#999;--line:#444;--acc:#6cc0a8}}
:root[data-theme="dark"]{--bg:#1c1c1a;--panel:#2a2a27;--ink:#eee;--mut:#999;--line:#444;--acc:#6cc0a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.4 system-ui,sans-serif;background:radial-gradient(ellipse at 50% 30%,rgba(255,200,120,.18),rgba(0,0,0,.45) 85%),repeating-linear-gradient(90deg,transparent 0 179px,rgba(0,0,0,.5) 179px 181px,rgba(255,220,170,.12) 181px 182px),repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 2px,rgba(255,255,255,.03) 2px 5px,rgba(0,0,0,.05) 5px 6px,transparent 6px 13px),linear-gradient(#7d502b,#5a3920);background-attachment:fixed}
.tabs{display:flex;gap:8px;padding:14px 20px 0;justify-content:center}
.tabs button{margin:0;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.wrap{display:flex;flex-wrap:wrap;gap:24px;padding:20px;justify-content:center;align-items:flex-start}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;width:100%;max-width:380px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:200px;resize:vertical}
textarea.s{min-height:60px}
.row{display:flex;gap:8px}
button{font:inherit;padding:9px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;margin-top:12px}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line);margin-left:6px}
.hint{font-size:12px;color:var(--mut);margin-top:10px}
h4{margin:16px 0 0;font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px}
.pages{display:flex;flex-direction:column;gap:16px;max-width:100%;overflow-x:auto;padding:8px 0 6px}
.read{max-width:640px;margin:0 auto;padding:20px}
.it{margin-bottom:6px}
.tab-hd{display:block;width:100%;text-align:left;margin:0;padding:12px 16px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:6px;font-weight:700}
.tab-hd.on{background:var(--acc);color:#fff}
.act{padding:4px 0}
.imp{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.ic{display:inline-flex;vertical-align:-4px;margin-right:6px}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tp{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tp button{margin:0;padding:6px 10px;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.tp button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tp button .ic{margin-right:4px}
.ai small{display:block;font-weight:400;opacity:.75;margin-left:24px}
.ai.g{font-weight:700}
.ai.on{background:var(--acc);color:#fff}
.ar{display:flex;gap:6px;margin-bottom:4px}
.nv{background:#fff;color:#111;border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.4}
.nv:empty{display:none}
.th{display:inline-block;margin:6px 6px 0 0;text-align:center;vertical-align:top}
.th img{height:72px;border-radius:4px;display:block;cursor:zoom-in}
.tc{font-size:12px;margin:2px 0}
.tc input{width:auto}
.th button{margin:0;padding:2px 8px;font-size:12px}
.big img{max-width:100%;border-radius:6px;margin-top:8px;cursor:zoom-out}
.nv h2{font-size:15px;margin:0 0 6px}
.nv p{margin:0 0 6px}
.ar button{margin:0;padding:6px 12px}
input[readonly]{opacity:.7;cursor:not-allowed}
.ai.sub{margin-left:22px;width:calc(100% - 22px)}
.pages .sheet{zoom:var(--z,1)}
@media (max-width:600px){
 input,textarea,select{font-size:16px}
 .tabs{padding:10px 12px 0}
 .wrap{padding:12px;gap:16px}
 .home{padding:12px}
 .arch{padding:10px}
 .go button{flex:1;padding:12px 10px}
 .brand h1{font-size:30px}
}
.mz{position:absolute;left:-9999px;top:0;visibility:hidden}
.home{max-width:560px;margin:0 auto;padding:20px;text-align:center}
.brand h1{margin:6px 0 0;font:700 36px Georgia,serif;color:#f6e7c8;text-shadow:0 2px 4px rgba(0,0,0,.7)}
.brand p{margin:2px 0 0;color:#ead7ae;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.go{display:flex;gap:10px;justify-content:center;margin:18px 0}
.go button{margin:0;padding:12px 22px;font-size:16px}
.arch{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.arch h2{margin:0 0 8px;font:700 15px Georgia,serif}
.ai{display:block;width:100%;text-align:left;margin:0 0 4px;background:transparent;color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--acc)}
.sheet{flex:none;width:148mm;height:105mm;padding:6mm;background:#fff;color:#111;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.25);font-family:Georgia,serif;overflow:hidden}
.hd{flex:none;display:flex;gap:4mm;align-items:flex-end;min-height:8mm;border-bottom:1px solid #111;padding-bottom:1.5mm;font-family:system-ui,sans-serif;font-size:9pt}
.au{flex:1;white-space:pre-wrap}
.pn{width:12mm;text-align:right;font-weight:700;font-size:11pt}
.bd{flex:1;min-height:0;overflow:hidden;padding-top:2.5mm;white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs,10pt);line-height:1.35}
.ft{flex:none;height:14mm;overflow:hidden;border-top:1px dotted #888;padding-top:1.5mm;font-family:system-ui,sans-serif;font-size:8pt;color:#333;white-space:pre-wrap}
.cv{gap:3mm}
.cv .top{display:flex;justify-content:space-between;align-items:flex-start;font-family:system-ui,sans-serif}
.cv .ca{font-weight:700;font-size:14pt;color:#c1121f;text-transform:uppercase;white-space:pre-wrap}
.cv .cd{text-align:right;font-size:9pt;line-height:1.6;white-space:nowrap}
.cv .g{font-family:Georgia,serif;font-size:12pt;font-weight:400;margin-right:1.5mm}
.cv .i,.cv .f{display:inline-block;min-width:24mm;border-bottom:1px solid #aaa;text-align:center}
.cv .bx{border:1px solid #111;padding:2mm;white-space:pre-wrap;overflow:hidden;font-size:10.5pt}
.cv .bx.r{flex:none;min-height:10mm}
.cv .bx.t{flex:1;font-size:13pt;font-weight:700}
.cv .nt{flex:none;height:22mm;border-top:1px dotted #888;padding-top:1.5mm;font-family:system-ui,sans-serif;font-size:8.5pt;white-space:pre-wrap;overflow:hidden}
.cv .nt b{display:block;font-size:7.5pt;color:#555;font-weight:400}
@page{size:A6 landscape;margin:0}
@media print{
 :root{padding:0}
 body{background:#fff}
 .tabs,.editor,.tab-hd,.act,.ai{display:none!important}
 .arch{background:none!important;box-shadow:none!important;border:0!important}
 .wrap,.read{display:block;padding:0;max-width:none}
 .pages{display:block;overflow:visible;padding:0}
 .sheet{height:104.5mm;box-shadow:none;break-after:page}
 .pages .sheet{zoom:1!important}
